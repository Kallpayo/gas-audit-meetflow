<div class="form-container w-full max-w-3xl mx-auto bg-white p-8 md:p-10 rounded-xl shadow-sm border border-slate-100 relative">
    <header class="mb-8 border-b border-slate-100 pb-6">
        <div class="flex items-center mb-2">
            <i class="fas fa-id-card-clip text-indigo-500 text-2xl mr-3"></i>
            <h2 id="formTitle" class="text-3xl font-bold text-slate-800">Directorio Corporativo</h2>
        </div>
        <p id="formSubtitle" class="mt-2 text-slate-500 text-sm">Alta y actualización de expedientes de personal para el control de asistencia, incidencias y reuniones en MeetFlow.</p>
    </header>

    <form id="userForm" class="space-y-6" novalidate>
        <input type="hidden" id="usuarioID" name="usuarioID">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
                <label for="nombreCompleto" class="block text-sm font-semibold text-slate-700 mb-1">Nombre del Empleado <span class="text-red-500">*</span></label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" required minlength="3" 
                       class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2.5 border focus:border-indigo-500 transition-colors"
                       placeholder="Ej: Carlos Mendoza">
            </div>
            <div>
                <label for="numeroEmpleado" class="block text-sm font-semibold text-slate-700 mb-1">ID Nómina / Carnet</label>
                <input type="text" id="numeroEmpleado" name="numeroEmpleado" 
                       class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2.5 border focus:border-indigo-500 transition-colors"
                       placeholder="Ej: MF-1042">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="correoCorporativo" class="block text-sm font-semibold text-slate-700 mb-1">Correo Corporativo <span class="text-red-500">*</span></label>
                <input type="email" id="correoCorporativo" name="correoCorporativo" required 
                       class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2.5 border focus:border-indigo-500 transition-colors"
                       placeholder="Ej: c.mendoza@empresa.com">
            </div>
            <div>
                <label for="telefonoContacto" class="block text-sm font-semibold text-slate-700 mb-1">Teléfono Interno / Extensión</label>
                <input type="text" id="telefonoContacto" name="telefonoContacto" 
                       class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2.5 border focus:border-indigo-500 transition-colors"
                       placeholder="Ej: +34 910 000 000 / Ext. 402">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label for="departamento" class="block text-sm font-semibold text-slate-700 mb-1">Departamento <span class="text-red-500">*</span></label>
                <select id="departamento" name="departamento" required class="mt-1 block w-full rounded-md border-slate-300 p-2.5 border bg-white">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label for="cargo" class="block text-sm font-semibold text-slate-700 mb-1">Cargo / Rol <span class="text-red-500">*</span></label>
                <select id="cargo" name="cargo" required class="mt-1 block w-full rounded-md border-slate-300 p-2.5 border bg-white">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label for="tipoContrato" class="block text-sm font-semibold text-slate-700 mb-1">Clasificación <span class="text-red-500">*</span></label>
                <select id="tipoContrato" name="tipoContrato" required class="mt-1 block w-full rounded-md border-slate-300 p-2.5 border bg-white">
                    <option value="">Seleccione...</option>
                    <option value="Empleado Fijo">Empleado Fijo (Staff)</option>
                    <option value="Contratista">Contratista Externo</option>
                    <option value="Pasante">Pasante / Interno</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="genero" class="block text-sm font-semibold text-slate-700 mb-1">Género <span class="text-red-500">*</span></label>
                <select id="genero" name="genero" required class="mt-1 block w-full rounded-md border-slate-300 p-2.5 border bg-white">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label for="modalidadTrabajo" class="block text-sm font-semibold text-slate-700 mb-1">Modalidad Operativa <span class="text-red-500">*</span></label>
                <select id="modalidadTrabajo" name="modalidadTrabajo" required class="mt-1 block w-full rounded-md border-slate-300 p-2.5 border bg-white">
                    <option value="Presencial">100% Presencial (In-Office)</option>
                    <option value="Híbrido">Híbrido (Hybrid)</option>
                    <option value="Remoto">100% Remoto (Remote)</option>
                </select>
            </div>
        </div>

        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 flex items-start gap-3 mt-4">
            <input type="checkbox" id="consentimientoGDPR" name="consentimientoGDPR" required class="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300">
            <label for="consentimientoGDPR" class="text-xs text-slate-600 leading-relaxed cursor-pointer">
                <span class="font-bold block text-slate-700">Cumplimiento de Privacidad y Minimización de Datos (GDPR / CCPA)</span>
                Certifico que este expediente contiene únicamente información corporativa e indispensable para la gestión operativa en MeetFlow CRM.
            </label>
        </div>

        <div class="flex justify-end pt-6 border-t border-slate-100 mt-8">
            <button type="submit" id="saveBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-8 rounded-lg transition-all shadow-sm flex items-center justify-center">
                <i class="fas fa-save mr-2"></i> Guardar Expediente
            </button>
        </div>
    </form>
</div>

<div id="userModal" class="fixed inset-0 bg-slate-900/70 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center border border-slate-100">
        <div id="modalIconContainer" class="mb-4"></div>
        <h3 id="userModalTitle" class="text-xl font-bold text-slate-800 mb-2"></h3>
        <p id="userModalMessage" class="text-sm text-slate-600 mb-6"></p>
        <button id="userModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-8 rounded-lg transition-colors">Aceptar</button>
    </div>
</div>

<script>
(function initUsuarioForm() {
    const userForm = document.getElementById('userForm');
    const saveBtn = document.getElementById('saveBtn');
    
    const userModal = document.getElementById('userModal');
    const userModalTitle = document.getElementById('userModalTitle');
    const userModalMessage = document.getElementById('userModalMessage');
    const userModalBtn = document.getElementById('userModalBtn');
    const modalIconContainer = document.getElementById('modalIconContainer');

    function showModal(type, title, msg) {
        userModalTitle.textContent = title;
        userModalMessage.textContent = msg;
        modalIconContainer.innerHTML = type === 'success' 
            ? '<i class="fas fa-check-circle text-green-500 text-5xl"></i>' 
            : '<i class="fas fa-exclamation-triangle text-red-400 text-5xl"></i>';
        userModal.classList.remove('hidden');
        userModal.classList.add('flex');
    }

    userModalBtn.addEventListener('click', () => {
        userModal.classList.add('hidden');
        userModal.classList.remove('flex');
    });
    
    const dropdownMap = {
        'Generos': 'genero',
        'Cargos': 'cargo',
        'Departamentos': 'departamento'
    };

    Object.keys(dropdownMap).forEach(listType => {
        const selectId = dropdownMap[listType];
        const select = document.getElementById(selectId);

        google.script.run
            .withSuccessHandler(data => {
                if(select) {
                    select.innerHTML = '<option value="">-- Seleccione --</option>';
                    try {
                        const items = JSON.parse(data);
                        if (items.length === 0) {
                            select.innerHTML = '<option value="">Sin opciones disponibles</option>';
                        } else {
                            items.forEach(item => select.add(new Option(item, item)));
                        }
                    } catch (e) {
                        select.innerHTML = '<option value="">Error al parsear</option>';
                    }
                }
            })
            .withFailureHandler(err => {
                if(select) select.innerHTML = '<option value="">Error de conexión</option>';
            })
            .getDropdownData(listType);
    });

    function setLoadState(isLoading) {
        if (isLoading) {
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Procesando...';
            saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Guardar Expediente';
            saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    }

    userForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!userForm.checkValidity()) {
            userForm.reportValidity();
            return;
        }

        setLoadState(true);
        const data = Object.fromEntries(new FormData(userForm));
        
        // Manejo explícito del checkbox booleano para el servidor
        data.consentimientoGDPR = document.getElementById('consentimientoGDPR').checked ? 'SI' : 'NO';

        google.script.run
            .withSuccessHandler(res => {
                if(res && res.success) {
                    showModal('success', 'Expediente Registrado', res.message);
                    userForm.reset();
                } else {
                    showModal('error', 'Rechazo del Servidor', res ? res.message : 'Error desconocido de validación.');
                }
                setLoadState(false);
            })
            .withFailureHandler(err => {
                showModal('error', 'Error de Conexión', 'Fallo crítico al contactar al servidor: ' + err.message);
                setLoadState(false);
            })
            .createUsuario(data);
    });
})();
</script>
